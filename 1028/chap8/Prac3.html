<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visibility 프로퍼티</title>
</head>
<style>
    span {
        visibility: hidden;
    }
</style>
<body>
    <h3>다음 빈 곳에 숨은 단어? <button onclick="toggleVisibility()">showhide</button></h3>
    <hr>
    <ul>
        <li>I (<span>love</span>) you
        <li>CSS is Cascading (<span>Style</span>) Sheets.
        <li>응답하라 (<span>1988</span>)
    </ul>
    
    <script>
        let span = document.getElementsByTagName("span");

        function toggleVisibility() {
            for (let i = 0; i < span.length; i++) {
                if (span[i].style.visibility === "hidden") {
                    span[i].style.visibility = "visible";
                } else {
                    span[i].style.visibility = "hidden";
                }
            }
        }
    </script>
</body>
</html>
