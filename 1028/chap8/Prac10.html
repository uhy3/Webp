<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 객체 동적 삽입</title>
    <script>
        function addAnswer(buttonObj, text) {
            let parentDiv = buttonObj.parentElement;
            if (parentDiv.querySelector(".answer-box")) {
                return;
            }

            let newDIV = document.createElement("div");
            newDIV.innerHTML = text;
            newDIV.className = "answer-box";
            
            newDIV.addEventListener("click", function() {
                this.remove();
            });
            parentDiv.appendChild(newDIV);
        } 
    </script>
</head>
<body>
    <h3>정답의 동적 삽입</h3>
    <hr>
    <div>
        <p>Q. 거울아 거울아 세상에서 누가 제일 예쁘니 ?</p>
        <button onclick="addAnswer(this, '백설공주')">답보기</button>
    </div>
    <br>
    <div>
        <P>Q. 죽느냐 사느냐 어떤 것이 문제인가 ?</P>
        <button onclick="addAnswer(this, '둘다')">답보기</button>
    </div>
</body>
</html>
