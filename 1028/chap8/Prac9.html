<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라면을 끓이는 순서</title>
</head>
<body>
    <h3>라면을 끓이는 순서</h3>
    <hr>
    <ol type="A" style="background-color: yellowgreen" onclick="addList()">
        <li>물을 끓인다.</li>
    </ol>

    <script>
        function addList() {
            let add = prompt("라면을 끓이는 순서를 입력하세요.");
            let list = document.createElement("li");
            list.innerHTML = add;
            document.getElementsByTagName("ol")[0].appendChild(list);
        }
    </script>
</body>
</html>
