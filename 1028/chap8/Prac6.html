<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>innerHTML</title>
</head>
<body>
    <h3>innerHTML</h3>
    <hr>
    <p onclick="inputTextorHTML()">이번 여름은 어디로 여행을 갈까요?</p>
    <script>
        function inputTextorHTML() {
            let text = prompt("여행지를 입력하세요.");
            document.write("<h3>innerHTML</h3>");
            document.write("<hr>");
            document.write("<p>" + text + "</p>");
        }
    </script>
</body>
</html>
