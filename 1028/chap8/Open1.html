<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갬블링 게임</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 48px 16px;
        }

        .number {
            margin: 12px;
            padding: 16px 24px;
            font-size: 2rem;
            cursor: pointer;
        }

        #result {
            min-height: 1.5em;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <h1>갬블링 게임</h1>
    <p>숫자를 차례로 클릭하세요. 마지막 숫자를 클릭하면 결과를 확인합니다.</p>
    <div aria-label="갬블링 숫자">
        <button class="number" type="button" aria-label="첫 번째 숫자">0</button>
        <button class="number" type="button" aria-label="두 번째 숫자">0</button>
        <button class="number" type="button" aria-label="세 번째 숫자">0</button>
    </div>
    <p id="result" aria-live="polite"></p>

    <script>
        const numberButtons = document.querySelectorAll('.number');
        const result = document.getElementById('result');

        numberButtons.forEach((button, index) => {
            button.addEventListener('click', () => {
                button.textContent = Math.floor(Math.random() * 3);

                if (index === numberButtons.length - 1) {
                    const numbers = Array.from(numberButtons, item => item.textContent);
                    result.textContent = numbers.every(number => number === numbers[0])
                        ? '성공! 세 숫자가 모두 같습니다.'
                        : '아쉽지만 실패했습니다. 다시 시도하세요.';
                } else {
                    result.textContent = '';
                }
            });
        });
    </script>
</body>
</html>
