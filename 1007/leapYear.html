<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>윤년 판별기</title>
</head>
<body>
	<h1>윤년 판별기</h1>
	<form id="year-form">
		<label for="year">년도를 입력하세요</label>
		<input id="year" type="number" min="1" step="1" placeholder="예: 2024" required>
		<button type="submit">윤년 확인</button>
	</form>
	<p id="result" aria-live="polite"></p>
	<script>
		document.getElementById('year-form').addEventListener('submit', function (event) {
			event.preventDefault();
			const year = Number(document.getElementById('year').value);
			const result = document.getElementById('result');

			if (!Number.isSafeInteger(year) || year < 1) {
				result.textContent = '1 이상의 정수를 입력해 주세요.';
				return;
			}

			const isLeapYear = year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0);
			result.textContent = year + '년은 ' + (isLeapYear ? '윤년' : '평년') + '입니다.';
		});
	</script>
</body>
</html>
