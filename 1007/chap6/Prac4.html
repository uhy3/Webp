<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let pw = prompt("암호를 입력하세요.");
        document.write("<h1> 암호를 입력하세요 </h1> <hr>");
        if (pw == "you") {
            document.write("<p>통과</p>");
        }
        else {
            document.write("<p>암호가 틀렸습니다.</p>");
        }
    </script>
</body>
</html>
