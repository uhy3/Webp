<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<h1>document.write로 표 만들기</h1>");
        document.write("<table border='1'>");
        document.write("<tr>");
        document.write("<td>n</td>");
        for (let i = 1; i <= 9; i++) {
            document.write("<td>" + (i) + "</td>");
        }
        document.write("</tr>");
        document.write("<tr>");
        document.write("<td>n^2</td>");
        for (let i = 1; i <= 9; i++) {
            document.write("<td>" + (i*i) + "</td>");
        }
        document.write("</tr>");
        document.write("</table>");

    </script>
</body>
</html>
