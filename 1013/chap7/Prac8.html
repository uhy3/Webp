<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16개 랜덤 색</title>
</head>
<style>
    div {
        display: inline-block;
        width: 150px;
        padding: 10px;
    }
</style>
<script>
    function Rand() {
        return Math.floor(Math.random()*256) + 1;
    }
</script>
<body>
    <h1>16개 랜덤 색</h1>
    <hr>
    <script>
        let colorname = []
        for (let i = 0; i < 16; i ++) {
            colorname[i] = "rgb(" + Rand() + ", " + Rand() + ", " + Rand() + ")";
        }

        for (let i = 0; i < colorname.length; i++) {
            document.write('<div style="background-color: ' + colorname[i] + ';">' + colorname[i] + '</div>');
        }
    </script>
</body>
</html>
