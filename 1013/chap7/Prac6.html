<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 분할</title>
</head>
<body>
    <h1>문자열 분할</h1>
    <hr>
    <script>
        let str = prompt("문자열 입력");
        let str_split = str.split("&");

        for (let i = 0; i < str_split.length; i++) {
            document.write(str_split[i] + "<br>");
        }
    </script>
</body>
</html>
