<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 배열 다루기</title>
</head>
<body>
    <h1>문자열 배열 다루기</h1>
    <hr>
    <script>
        let names = new Array("wonsun", "jaemoonlee", "kitae", "gracehwang");

        document.write("이름: ");
        for (let i = 0; i < names.length; i++) {
            document.write(names[i] + " ");
        }
        
        document.write("<br> 가장 긴 이름: ")
        let longest = names[0];
        for (let i = 0; i < names.length; i++) {
            if (longest.length < names[i].length) longest = names[i];
        }
        document.write(longest);

        document.write("<br> 가장 먼저 나오는 이름: ")
        let fisrt = names[0];
        for (let i = 1; i < names.length; i++) {
            if (names[i] < fisrt) first = names[i];
        }
        document.write(first);

        document.write("<br> 증가 순 이름: ")
        let names_sort = names.sort();
        for (let i = 0; i < names.length; i++) {
            document.write(names[i] + " ");
        }
    </script>
</body>
</html>
