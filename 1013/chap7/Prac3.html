<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방문 시간에 따라 변하는 배경색</title>
</head>
<body>
    <h3>오전이면 lightblue, 오후이면 orange 배경</h3>
    <hr>
    <script>
        let cur = new Date();
        if (cur.getHours() < 12) {
            document.body.style.backgroundColor = "lightblue";
        }
        else {
            document.body.style.backgroundColor = "orange";
        }
        document.write("현재 시간: " + cur.getHours() + "시 " + cur.getMinutes() + "분 " + cur.getSeconds() + "초");
    </script>
</body>
</html>
