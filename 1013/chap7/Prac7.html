<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17개 css2 색이름/색</title>
</head>
<style>
    div {
        display: inline-block;
        width: 60px;
        padding: 10px;
    }
</style>
<body>
    <h1>17개 css2 색이름/색</h1>
    <hr>
    <script>
        let colorname = ["maroon", "red", "orange", "yellow", "olive", "purple", "fuchsia", "white", "lime", "green", "navy", "blue", "aqua", "teal", "black", "silver", "gray"];

        for (let i = 0; i < colorname.length; i++) {
            document.write('<div style="background-color: ' + colorname[i] + ';">' + colorname[i] + '</div>');
        }
    </script>
</body>
</html>
