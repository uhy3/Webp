<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let timer = null;

    function startClock() {
        clearTimeout(timer);

        let now = new Date();
        document.getElementById("clock").innerText = now.toLocaleTimeString();

        timer = setTimeout(startClock, 1000);
    }
</script>
<body onload="startClock()">
    <div id="clock"></div>
</body>
</html>
