<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카푸치노 만들기</title>
</head>
<style>
    ol {
        list-style-type: none;
    }
    span {
        font-weight: bold;
        display: inline-block;
        width: 30px;
        text-align: center;
        font-size: 30px;
        font-style: italic;
    }
    p {
        display: inline-block;
        margin-left: 10px;
    }
</style>
<body>
    <h1>카푸치노</h1>
    <hr>
    <ol>
        <caption>카푸치노 만드는 순서</caption>
        <li><span>1.</span><p>에스프레소를 추출한다. 반드시 에스프레소 콩을 사용해야 제맛이 난다.</p></li>
        <li><span>2.</span><p>적당한 용기에 우유를 넣어 중탕을 하거나 끓기 직전까지 데운다.</p></li>
        <li><span>3.</span><p>스팀한 우유를 에스프레소 위에 붓는다.</p></li>
        <li><span>4.</span><p>원하는 토핑을 올린다.</p></li>
    </ol>
</body>
</html>
