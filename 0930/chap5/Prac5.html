<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float 배치</title>
</head>
<style>
    img {
        float:left;
        padding: 10px;
    }
</style>
<body>
    <h1>스폰지밥</h1>
    <hr>
    <img src="file/spongebob.webp" alt="스폰지밥" width="200px">
    <div>저는 스폰지밥입니다. 먹는 밥이 아니고요 제 이름이 그래요. 그리고 어린이부터 노인까지 많은 분들의 사랑을 받고 있어요.</div>
</body>
</html>
