<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트 만들기</title>
</head>
<style>
    ul {
        background-color: aliceblue;
        padding-right: 10px;
        background-image: url(file/worldmap.png);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
    }

    li:hover {
        background-color: yellowgreen;
    }
</style>
<body>
    <h1>가보고 싶은 나라</h1>
    <hr>
    <ul>
        <li>일본</li>
        <li>미국</li>
        <li>프랑스</li>
    </ul>
</body>
</html>
