<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>
</head>
<style>
    img {
        transition: width 2s ease-in-out;
    }
    img:hover {
        width: 100vw;
    }
</style>
<body>
    <h1>마우스를 올려보세요</h1>
    <hr>
        <img src="file/spongebob.webp" width="200px">
</body>
</html>
