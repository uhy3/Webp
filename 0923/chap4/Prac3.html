<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>색 테이블 만들기</title>
</head>
<style>
    td#Gold {
        background-color: gold;
    }
    td#Brown {
        background-color: brown;
    }
    td#DeepSkyBlue {
        background-color: deepskyblue;
    }
    td#Blueviolet {
        background-color: blueviolet;
    }
    td#DarkOrange {
        background-color: darkorange;
    }
    td#OliveDrab {
        background-color: olivedrab;
    }
</style>
<body>
    <h1>색 이름과 코드</h1>
    <hr>
    <table border="1">
        <thead>
            <th>이름</th>
            <th>코드</th>
            <th>색</th>
            <th>이름</th>
            <th>코드</th>
            <th>색</th>
        </thead>

        <tbody>
            <tr>
            <td>Brown</td>
            <td>#A52A2A</td>
            <td id="Brown"></td>
            <td>DeepSkyBlue</td>
            <td>#00BFFF</td>
            <td id="DeepSkyBlue"></td>
            </tr>

            <tr>
            <td>Blueviolet</td>
            <td>#8A2BE2</td>
            <td id="Blueviolet"></td>
            <td>Gold</td>
            <td>#FFD700</td>
            <td id="Gold"></td>
            </tr>

            <tr>
            <td>DarkOrange</td>
            <td>#FF8C00</td>
            <td id="DarkOrange"></td>
            <td>OliveDrab</td>
            <td>#6B8E23</td>
            <td id="OliveDrab"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
