<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소프트웨어 기술 선호에 관한 설문</title>
</head>
<body>
    <header>
        <h1>설문지</h1>
        <p>소프트웨어 기술에 관한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
    </header>

    <hr>
    <section>
    <form action="submit.php" method="post">
        <label for="grade">학년</label>
        <input type="radio" id="grade1" name="grade" value="1" required>
        <label for="grade1">1학년</label>
        <input type="radio" id="grade2" name="grade" value="2" required>
        <label for="grade2">2학년</label>
        <input type="radio" id="grade3" name="grade" value="3" required>
        <label for="grade3">3학년</label>
        <input type="radio" id="grade4" name="grade" value="4" required>
        <label for="grade4">4학년</label><br>
        
        <br>

        <label for="gender">성별</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">남</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">여</label><br>

        <br>

        <label for="interest">관심분야</label>
        <select id="interest" name="interest" required style="width: 100px;">
            <option value="web">웹 개발</option>
            <option value="mobile">모바일 개발</option>
            <option value="ai">인공지능</option>
        </select><br>

        <br>

        <label for="dream">진로</label>
        <input type="checkbox" id="dream1" name="dream" value="development" required>
        <label for="dream1">개발</label>
        <input type="checkbox" id="dream2" name="dream" value="planning" required>
        <label for="dream2">기획</label>
        <input type="checkbox" id="dream3" name="dream" value="sales" required>
        <label for="dream3">영업</label>
        <input type="checkbox" id="dream4" name="dream" value="entrepreneurship" required>
        <label for="dream4">창업</label><br>

        <br>
        
        <label for="wanttosay">남기고 싶은 말</label><br>
        <textarea id="wanttosay" name="wanttosay" rows="4" cols="50" placeholder="글을 남겨주세요"></textarea><br>

        <br>
    </section>
    </form>
    <footer>
        Copyright 2022 by uhy3
    </footer>

</body>
</html>
